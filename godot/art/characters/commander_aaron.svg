<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Commander Aaron: Hero Reader "Cosmic Storybook" style.
       Flat shapes, 6px navy outlines, one cel-shade tone per material. -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="65%">
      <stop offset="0" stop-color="#3B3F8F"/>
      <stop offset="1" stop-color="#1B1F4B"/>
    </radialGradient>
    <clipPath id="frame"><circle cx="256" cy="256" r="244"/></clipPath>
  </defs>
  <g stroke="#141836" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
    <!-- badge frame -->
    <circle cx="256" cy="256" r="244" fill="url(#bg)"/>
    <g clip-path="url(#frame)" stroke="none">
      <circle cx="96" cy="110" r="3" fill="#FFF4DC"/>
      <circle cx="420" cy="90" r="4" fill="#FFF4DC"/>
      <circle cx="440" cy="200" r="2.5" fill="#FFF4DC"/>
      <circle cx="70" cy="230" r="2.5" fill="#FFF4DC"/>
      <path d="M392 140 l6 14 14 6 -14 6 -6 14 -6 -14 -14 -6 14 -6z" fill="#FFC93C"/>
      <circle cx="120" cy="420" r="70" fill="#2EC4B6" opacity=".18"/>
    </g>

    <g clip-path="url(#frame)">
      <!-- uniform: navy jacket, gold trim -->
      <path d="M60 520 C70 420 140 392 200 382 L312 382 C372 392 442 420 452 520 Z" fill="#2B3A8C"/>
      <path d="M200 382 L256 462 L312 382" fill="#22307A"/>
      <!-- high collar -->
      <path d="M196 372 L256 440 L316 372 L330 404 L256 476 L182 404 Z" fill="#1F2A6E"/>
      <path d="M182 404 L256 476 L330 404" fill="none" stroke="#FFC93C" stroke-width="7"/>
      <!-- shoulder boards -->
      <path d="M86 440 C110 414 150 400 176 398 L184 424 C152 430 120 444 98 462 Z" fill="#FFC93C"/>
      <path d="M426 440 C402 414 362 400 336 398 L328 424 C360 430 392 444 414 462 Z" fill="#FFC93C"/>
      <!-- commander star badge -->
      <circle cx="356" cy="458" r="26" fill="#FFC93C"/>
      <path d="M356 440 l5.5 11.5 12.5 1.5 -9.3 8.6 2.5 12.4 -11.2-6.2 -11.2 6.2 2.5-12.4 -9.3-8.6 12.5-1.5z" fill="#FF7A45" stroke-width="3"/>
    </g>

    <!-- neck -->
    <path d="M214 330 L214 392 C236 410 276 410 298 392 L298 330 Z" fill="#E9B38F"/>

    <!-- ears -->
    <path d="M150 240 C126 232 120 262 128 282 C134 298 150 302 160 296 Z" fill="#F4C6A2"/>
    <path d="M362 240 C386 232 392 262 384 282 C378 298 362 302 352 296 Z" fill="#F4C6A2"/>

    <!-- head: broad, squarish -->
    <path d="M156 196 C156 128 204 104 256 104 C308 104 356 128 356 196 L356 268 C356 330 312 368 256 368 C200 368 156 330 156 268 Z" fill="#F4C6A2"/>

    <!-- beard: full, reddish brown, greying at the chin -->
    <path d="M156 196 C156 300 170 336 196 362 C218 386 238 396 256 396 C274 396 294 386 316 362 C342 336 356 300 356 196
             L346 200 C346 250 336 282 316 296 C300 284 282 280 256 280 C230 280 212 284 196 296 C176 282 166 250 166 200 Z" fill="#9C5A2C"/>
    <path d="M232 334 C238 330 274 330 280 334 C290 350 300 360 306 352 C292 378 274 392 256 394 C238 392 220 378 206 352 C212 360 222 350 232 334 Z" fill="#CFC6BA" stroke="none"/>
    <g fill="none" stroke="#B9AFA2" stroke-width="3"><path d="M244 346 q4 10 0 22"/><path d="M268 346 q-4 10 0 22"/><path d="M256 352 v18"/></g>
    <path d="M222 372 C236 386 248 392 256 393 C264 392 276 386 290 372" fill="none" stroke="#B9AFA2" stroke-width="3"/>
    <!-- beard texture -->
    <g fill="none" stroke="#7A4220" stroke-width="3">
      <path d="M180 318 q6 10 2 20"/><path d="M332 318 q-6 10 -2 20"/>
      <path d="M204 340 q4 8 0 16"/><path d="M308 340 q-4 8 0 16"/>
    </g>

    <!-- mouth: warm, confident smile -->
    <path d="M226 318 C240 334 272 334 288 316 C276 322 240 324 226 318 Z" fill="#FFF4DC" stroke-width="4"/>
    <!-- moustache -->
    <path d="M206 306 C222 286 244 290 256 298 C268 290 290 286 306 306 C292 304 276 308 256 312 C236 308 220 304 206 306 Z" fill="#8A4C24"/>

    <!-- nose -->
    <path d="M248 212 C244 236 236 252 232 262 C232 276 246 280 256 276 C266 280 280 276 280 262 C276 252 270 238 266 214" fill="#EBB28C" stroke-width="5"/>

    <!-- eyes: blue, one brow lifted (friendly 'ready, hero?') -->
    <g>
      <ellipse cx="212" cy="222" rx="18" ry="14" fill="#FFFFFF" stroke-width="5"/>
      <ellipse cx="300" cy="222" rx="18" ry="14" fill="#FFFFFF" stroke-width="5"/>
      <circle cx="214" cy="223" r="9" fill="#5B9BD5" stroke="none"/>
      <circle cx="298" cy="223" r="9" fill="#5B9BD5" stroke="none"/>
      <circle cx="214" cy="223" r="4.5" fill="#141836" stroke="none"/>
      <circle cx="298" cy="223" r="4.5" fill="#141836" stroke="none"/>
      <circle cx="217" cy="219" r="2.5" fill="#FFFFFF" stroke="none"/>
      <circle cx="301" cy="219" r="2.5" fill="#FFFFFF" stroke="none"/>
      <!-- upper lids -->
      <path d="M193 218 C200 206 224 206 231 218 Z" fill="#E9B38F" stroke-width="4"/>
      <path d="M281 218 C288 206 312 206 319 218 Z" fill="#E9B38F" stroke-width="4"/>
      <!-- smile lines -->
      <path d="M184 232 q-6 6 -4 14" fill="none" stroke-width="3"/>
      <path d="M328 232 q6 6 4 14" fill="none" stroke-width="3"/>
    </g>
    <!-- heavy brows -->
    <path d="M180 200 C192 186 220 184 240 192 L238 206 C220 200 200 202 184 210 Z" fill="#8A5A2E"/>
    <path d="M332 200 C320 186 292 184 272 192 L274 206 C292 200 312 202 328 210 Z" fill="#8A5A2E"/>
    <!-- forehead line -->
    <path d="M224 172 C244 166 268 166 288 172" fill="none" stroke="#D99B78" stroke-width="3"/>

    <g transform="matrix(-1 0 0 1 512 0)">
    <!-- hair: short sides, tousled top flicked up and over to one side -->
    <path d="M154 206 C148 168 156 138 172 122 C166 104 180 92 198 96 C200 78 222 70 240 76
             C252 60 278 58 292 70 C306 54 336 56 346 70 C362 56 392 60 404 74
             C386 78 376 86 372 96 C392 96 404 106 408 118 C390 114 376 118 368 126
             C366 154 362 180 356 206 C352 176 342 156 326 146 C300 158 264 160 234 152
             C204 160 180 172 168 188 C162 196 156 200 154 206 Z" fill="#B0773F"/>
    <g fill="none" stroke="#8A5A2E" stroke-width="4">
      <path d="M204 120 C234 104 270 102 300 92"/>
      <path d="M232 140 C264 128 304 122 352 104"/>
      <path d="M180 150 C196 138 214 132 226 130"/>
    </g>
    <path d="M300 84 C318 76 340 76 360 82" fill="none" stroke="#D49A5C" stroke-width="5"/>

    </g>

    <!-- comms headset -->
    <rect x="128" y="246" width="26" height="44" rx="10" fill="#2EC4B6"/>
    <path d="M140 290 C150 318 176 330 200 330" fill="none" stroke="#141836" stroke-width="5"/>
    <circle cx="204" cy="330" r="8" fill="#FF7A45" stroke-width="4"/>
  </g>
</svg>
